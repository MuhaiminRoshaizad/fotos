name: Release

# Push a tag like v1.0.0 (matching `version:` in pubspec.yaml) to publish a signed APK.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for ${name} is not set; refusing to publish a debug-signed APK"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols

      - name: Rename APK and write checksum
        run: |
          apk="fotos-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      # Obfuscated stack traces can only be read back with these symbols.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "fotos-${GITHUB_REF_NAME}.apk" "fotos-${GITHUB_REF_NAME}.apk.sha256"
          --title "fotos ${GITHUB_REF_NAME}" --generate-notes
